<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpanion – Oura verbinden</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 30rem; margin: 0 auto; padding: 3rem 1rem; text-align: center; }
  h1 { font-size: 1.4rem; }
  a.btn { display: inline-block; margin-top: 1rem; padding: .9rem 1.6rem; border-radius: .6rem; background: #8b5cf6; color: #fff; text-decoration: none; font-weight: 600; }
  p.small { font-size: .9rem; opacity: .75; }
</style>
</head>
<body>
<h1 id="title">Oura ist verbunden</h1>
<p id="text">Du wirst zurück zur Helpanion-App geleitet.</p>
<a class="btn" id="open" href="#">Zurück zu Helpanion</a>
<p class="small" id="hint">Öffnet sich die App nicht von selbst, tippe auf die Taste.</p>
<p class="small">Diese Seite gibt die Antwort von Oura nur an die App auf deinem Gerät weiter. Auf dem Webserver wird nichts gespeichert.</p>
<script>
// Oura leitet nach der Anmeldung hierher (OAuth2, Client-Flow): das Zugangs-Token steht im
// URL-Fragment (#access_token=…), das der Browser nie an den Server sendet; eine Ablehnung kommt
// als ?error=… in der Query. Beides wird an die App übergeben (intent-Link, siehe unten),
// danach wird die Adresse im Browser-Verlauf bereinigt, damit das Token dort nicht stehen bleibt.
// Der state trägt ein Präfix (a. = Helpanion, d. = Debug-Build, ab App-Version 150): weitergeleitet wird nur als
// intent://…;package=… an dieses Paket - helpanion:// könnte auch eine fremde App beanspruchen (Audit S4). Seit
// 2026-11-02 gibt es keinen Rückweg über helpanion:// mehr: ein state ohne Präfix (App bis 149, oder ein fremder
// Link) bekommt nur den Hinweis, die App zu aktualisieren - das Token verlässt den Browser dann nicht.
// Ein Intent-URI hat kein eigenes Fragment, die Werte aus dem Fragment wandern deshalb in die Query. Seit 2026-11-02
// (Feedback 007d5049) zusätzlich alle Werte base64url-kodiert in p - nur Zeichen, die kein Browser umkodiert; die App
// ab Version 152 liest nur p, die Einzelwerte bleiben für Version 150/151.
(function () {
  var query = location.search || "";
  var hash = location.hash || "";
  var params = [query.replace(/^\?/, ""), hash.replace(/^#/, "")].filter(function (p) { return p; }).join("&");
  var stateMatch = /(?:^|&)state=([ad])\.[0-9a-f]{32}(?:&|$)/.exec(params);
  var packages = { a: "com.qn.helpanion", d: "com.qn.helpanion.debug" };
  var packed = btoa(params).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  var target = stateMatch
    ? "intent://oura/callback?p=" + packed + "&" + params + "#Intent;scheme=helpanion;package=" + packages[stateMatch[1]] + ";end"
    : null;
  var denied = /[?&]error=/.test(query);
  var answered = denied || /access_token=/.test(hash);
  if (answered && !target) {
    document.getElementById("title").textContent = "Bitte Helpanion aktualisieren";
    document.getElementById("text").textContent = "Diese Version der App kann Oura nicht mehr verbinden. Aktualisiere Helpanion und verbinde Oura danach erneut in der App.";
    document.getElementById("hint").textContent = "";
    document.getElementById("open").style.display = "none";
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    return;
  }
  if (denied) {
    document.getElementById("title").textContent = "Verbindung abgelehnt";
    document.getElementById("text").textContent = "Du hast Helpanion keinen Zugriff erteilt. Du kannst es in der App jederzeit erneut versuchen.";
    document.getElementById("hint").textContent = "";
  } else if (!/access_token=/.test(hash)) {
    document.getElementById("title").textContent = "Keine Antwort von Oura";
    document.getElementById("text").textContent = "Diese Seite wird nur am Ende der Oura-Anmeldung aus der Helpanion-App aufgerufen.";
    document.getElementById("hint").textContent = "";
  }
  if (target) { document.getElementById("open").href = target; } else { document.getElementById("open").style.display = "none"; }
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (target && !denied) { setTimeout(function () { location.href = target; }, 300); }
})();
</script>
</body>
</html>
